spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3310}/customer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: "${DB_USER:ticketflow}"
    password: "${DB_PASSWORD:ticketflow}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Vos propriétés personnalisées (conservées depuis votre fichier d'origine)
custom:
  greeting: "Bienvenue dans TicketFlow"

ticketflow:
  message: "Bienvenue dans TicketFlow - configuration centralisée"xx